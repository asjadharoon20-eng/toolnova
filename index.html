function humanizeText(){const input=document.getElementById('humanizer-input').value;const style=document.getElementById('humanizer-style').value;if(!input.trim()){alert('Please paste some text first.');return}let text=input.replace(/[ \t]+/g,' ').replace(/\n{3,}/g,'\n\n').trim();const replacements=style==='professional'?[[/\bget\b/gi,'obtain'],[/\bhelp\b/gi,'support'],[/\buse\b/gi,'utilize'],[/\bshow\b/gi,'demonstrate']]:style==='simple'?[[/\butilize\b/gi,'use'],[/\bapproximately\b/gi,'about'],[/\bdemonstrate\b/gi,'show'],[/\bassistance\b/gi,'help']]:[[/\bin order to\b/gi,'to'],[/\bdue to the fact that\b/gi,'because'],[/\bat this point in time\b/gi,'now'],[/\bmake use of\b/gi,'use']];for(const [pattern,replacement] of replacements)text=text.replace(pattern,replacement);document.getElementById('humanizer-output').value=text;}
function openYouTubeForTranscript(){const raw=document.getElementById('yt-url').value.trim();if(!raw){alert('Paste a YouTube video URL first.');return}let u;try{u=new URL(raw)}catch(e){alert('Please enter a valid YouTube URL.');return}if(!['youtube.com','www.youtube.com','m.youtube.com','youtu.be','www.youtu.be'].includes(u.hostname)){alert('Please use a YouTube video URL.');return}window.open(u.href,'_blank','noopener,noreferrer')}

function extractVideoId(){const raw=document.getElementById('yt-url')?.value.trim()||'';let id='';try{const u=new URL(raw);if(u.hostname==='youtu.be'||u.hostname==='www.youtu.be')id=u.pathname.split('/').filter(Boolean)[0]||'';else if(['youtube.com','www.youtube.com','m.youtube.com'].includes(u.hostname))id=u.searchParams.get('v')||u.pathname.match(/\/(?:shorts|embed|live)\/([^/?]+)/)?.[1]||'';}catch(e){}const box=document.getElementById('yt-video-info');if(box)box.innerHTML=id?`<div class="result"><small>VIDEO ID</small><b style="font-size:17px">${esc(id)}</b><p>Thumbnail preview:</p><img class="preview" src="https://img.youtube.com/vi/${encodeURIComponent(id)}/hqdefault.jpg" alt="Video thumbnail"></div>`:`<div class="result">Please enter a valid YouTube video URL.</div>`;return id}
function transcriptToSRT(){const el=document.getElementById('yt-transcript-text');if(!el||!el.value.trim())return alert('Paste transcript text first.');const lines=el.value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);let i=0;const blocks=[];for(const line of lines){const m=line.match(/^(\d{1,2}:\d{2}(?::\d{2})?(?:[.,]\d{1,3})?)\s*(?:-->|-)?\s*(.*)$/);if(m&&m[2]){const start=toSrtTime(m[1]),end=secondsToSrt(start+3);blocks.push(`${++i}\n${secondsToSrt(start)} --> ${end}\n${m[2]}`)}else if(!/^\d+$/.test(line)&&!line.includes('-->'))blocks.push(`${++i}\n${secondsToSrt((i-1)*3)} --> ${secondsToSrt(i*3)}\n${line}`)}const result=blocks.join('\n\n');el.value=result;download(new Blob([result],{type:'text/plain;charset=utf-8'}),'transcript.srt');}
function toSeconds(t){const a=t.replace(',','.').split(':').map(Number);if(a.length===3)return a[0]*3600+a[1]*60+a[2];if(a.length===2)return a[0]*60+a[1];return Number(a[0])||0}
function secondsToSrt(s,vtt=false){s=Math.max(0,s);const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=Math.floor(s%60),ms=Math.round((s-Math.floor(s))*1000);return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}${vtt?'.':','}${String(ms).padStart(3,'0')}`}
function toSrtTime(t){return toSeconds(t)}
function loadSubtitleFile(e){const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{const el=document.getElementById('subtitle-text');el.value=String(r.result||'').replace(/^\uFEFF/,'');document.getElementById('subtitle-format').textContent=/^\s*WEBVTT/m.test(el.value)?'VTT':'SRT';analyzeSubtitles()};r.readAsText(f)}
function parseSubtitleCues(text){const normalized=text.replace(/^\uFEFF/,'').replace(/\r/g,'').replace(/^WEBVTT[^\n]*\n/,'');return normalized.split(/\n\s*\n/).map(block=>{const lines=block.trim().split('\n');const ti=lines.findIndex(x=>x.includes('-->'));if(ti<0)return null;const m=lines[ti].match(/(\d{1,2}:\d{2}(?::\d{2})?[,.]\d{1,3})\s*-->\s*(\d{1,2}:\d{2}(?::\d{2})?[,.]\d{1,3})/);if(!m)return null;return {start:toSeconds(m[1]),end:toSeconds(m[2]),text:lines.slice(ti+1).join('\n'),id:lines.slice(0,ti).join(' ')}}).filter(Boolean)}
function analyzeSubtitles(){const text=document.getElementById('subtitle-text').value;const cues=parseSubtitleCues(text);document.getElementById('subtitle-count').textContent=String(cues.length);document.getElementById('subtitle-chars').textContent=String(text.length);document.getElementById('subtitle-format').textContent=/^\s*WEBVTT/m.test(text)?'VTT':'SRT';document.getElementById('subtitle-duration').textContent=cues.length?secondsToSrt(Math.max(...cues.map(c=>c.end))).slice(0,8):'—';const preview=document.getElementById('subtitle-preview');if(!cues.length){preview.innerHTML='<small>NO CUES FOUND</small><p>Check that each cue has a timestamp line such as 00:00:01,000 --> 00:00:03,000.</p>';return}const bg=document.getElementById('subtitle-bg').value;preview.innerHTML=`<small>CAPTION PREVIEW · ${cues.length} CUES</small><div style="background:${bg};color:white;padding:20px;border-radius:12px;text-align:center;margin-top:10px">${esc(cues[0].text).replace(/\n/g,'<br>')}</div><p class="notice">First cue: ${secondsToSrt(cues[0].start)} – ${secondsToSrt(cues[0].end)}. ${cues.filter(c=>c.end<=c.start).length} cue(s) have invalid timing; ${cues.filter(c=>!c.text.trim()).length} cue(s) have empty text.</p>`}
function shiftSubtitleTiming(){const shift=Number(document.getElementById('subtitle-shift').value)||0,el=document.getElementById('subtitle-text');if(!el.value.trim())return alert('Import or paste subtitle text first.');el.value=el.value.replace(/(\d{1,2}:\d{2}(?::\d{2})?[,.]\d{1,3})\s*-->\s*(\d{1,2}:\d{2}(?::\d{2})?[,.]\d{1,3})/g,(all,a,b)=>{const vtt=all.includes('.')&&!all.includes(',');return `${secondsToSrt(toSeconds(a)+shift,vtt)} --> ${secondsToSrt(toSeconds(b)+shift,vtt)}`});analyzeSubtitles()}
function downloadSubtitles(fmt){let text=document.getElementById('subtitle-text').value;if(!text.trim())return alert('Import or paste subtitle text first.');const cues=parseSubtitleCues(text);if(!cues.length)return alert('No valid subtitle cues found.');const vtt=fmt==='vtt';let result=(vtt?'WEBVTT\n\n':'')+cues.map((c,i)=>`${vtt?'':(i+1)+'\n'}${secondsToSrt(c.start,vtt)} --> ${secondsToSrt(c.end,vtt)}\n${c.text}`).join('\n\n');download(new Blob([result],{type:'text/plain;charset=utf-8'}),`toolnova-subtitles.${fmt}`)}
function generateYouTubePack(){const topic=document.getElementById('yt-topic').value.trim(),aud=document.getElementById('yt-audience').value.trim(),format=document.getElementById('yt-format').value,tone=document.getElementById('yt-tone').value,channel=document.getElementById('yt-channel').value.trim(),cta=document.getElementById('yt-cta').value.trim();if(!topic)return alert('Enter the video topic first.');const clean=topic.replace(/[\n\r]+/g,' ').trim(),tags=[...new Set((clean+' '+aud+' '+format+' YouTube').toLowerCase().match(/[a-z0-9]+/g)||[])].slice(0,12),hashtags=tags.slice(0,5).map(x=>'#'+x.replace(/\s/g,''));const titleCandidates=[`${clean} | ${tone} ${format}`,`${tone} ${clean} ${format==='Shorts'?'#Shorts':''}`.trim(),`${clean}: What You Need to Know`];const desc=`${clean}\n\n${aud?'Made for: '+aud+'\n\n':''}${cta?cta+'\n\n':''}${channel?'Channel: '+channel+'\n\n':''}If you enjoyed this video, share your thoughts in the comments.\n\n${hashtags.join(' ')}`;const pack=`TITLE IDEAS\n1. ${titleCandidates[0]}\n2. ${titleCandidates[1]}\n3. ${titleCandidates[2]}\n\nDESCRIPTION\n${desc}\n\nHASHTAGS\n${hashtags.join(' ')}\n\nTAGS (comma-separated)\n${tags.join(', ')}\n\nPUBLISHING CHECKLIST\n[ ] Confirm title accurately represents video\n[ ] Check spelling and audience suitability\n[ ] Add thumbnail and captions\n[ ] Confirm music/visual rights\n[ ] Review audience setting and visibility`;document.getElementById('yt-pack').innerHTML=`<label class="label" for="yt-pack-output">Your publishing pack</label><textarea class="area" id="yt-pack-output" style="min-height:300px">${esc(pack)}</textarea><div class="buttonrow"><button class="btn" onclick="copyText(document.getElementById('yt-pack-output').value)">Copy full pack</button><button class="secondary" onclick="download(new Blob([document.getElementById('yt-pack-output').value],{type:'text/plain;charset=utf-8'}),'youtube-publishing-pack.txt')">Download TXT</button></div><p class="notice">These are structured draft ideas, async function imageTool(s){const f=document.getElementById('file')?.files?.[0];if(!f)return out(resultBox('NOTICE','Choose an image first'));if(s==='image-base64'){const r=new FileReader();r.onload=()=>out(`<textarea class="area">${esc(r.result)}</textarea><button class="secondary" onclick="copyText(document.querySelector('#output textarea').value)">Copy Base64</button>`);r.readAsDataURL(f);return}const img=new Image();img.onload=()=>{let w=img.width,h=img.height,c=document.createElement('canvas'),ctx=c.getContext('2d',{willReadFrequently:true});if(s==='thumbnail-studio'){w=1280;h=720;c.width=w;c.height=h;ctx.fillStyle=val('thumb-bg')||'#243b80';ctx.fillRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);ctx.fillStyle='rgba(0,0,0,.30)';ctx.fillRect(0,0,w,h);ctx.fillStyle=val('thumb-color')||'#fff';ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=`900 ${Math.max(24,Math.min(150,num('thumb-size')||76))}px Arial`;let words=(val('thumb-text')||'YOUR BIG TITLE').toUpperCase().split(/\s+/),lines=[],line='';for(const word of words){let test=(line+' '+word).trim();if(ctx.measureText(test).width>w-100&&line){lines.push(line);line=word}else line=test}if(line)lines.push(line);const fs=Math.max(24,Math.min(150,num('thumb-size')||76));ctx.font=`900 ${fs}px Arial`;lines.slice(0,3).forEach((t,i)=>{ctx.lineWidth=8;ctx.strokeStyle='rgba(0,0,0,.7)';ctx.strokeText(t,w/2,h/2+(i-(Math.min(lines.length,3)-1)/2)*(fs+10));ctx.fillText(t,w/2,h/2+(i-(Math.min(lines.length,3)-1)/2)*(fs+10))});return finishCanvas(c,'toolnova-thumbnail.png','image/jpeg',.94)}if(s==='image-resizer'){w=Math.max(1,Math.min(8000,Number(document.getElementById('w').value)||w));h=Math.max(1,Math.min(8000,Number(document.getElementById('h').value)||h))}if(s==='image-enhancer'){const scale=Math.max(1,Math.min(2,num('enh-scale')||1));w=Math.min(8000,Math.round(w*scale));h=Math.min(8000,Math.round(h*scale));c.width=w;c.height=h;ctx.filter=`brightness(${Math.max(50,Math.min(160,num('enh-bright')||108))}%) contrast(${Math.m async function pdfTool(s){const fs=[...document.getElementById('file').files];if(!fs.length)return out(resultBox('NOTICE','Choose file(s) first'));if(!window.PDFLib)return out(resultBox('ERROR','PDF library failed to load. Check internet connection and retry.'));try{const {PDFDocument,StandardFonts,rgb}=PDFLib;if(s==='jpg-to-pdf'||s==='png-to-pdf'){const f=fs[0],bytes=await f.arrayBuffer(),pdf=await PDFDocument.create(),im=s==='png-to-pdf'?await pdf.embedPng(bytes):await pdf.embedJpg(bytes),pg=pdf.addPage([595,842]),sc=Math.min(540/im.width,780/im.height);pg.drawImage(im,{x:(595-im.width*sc)/2,y:(842-im.height*sc)/2,width:im.width*sc,height:im.height*sc});return savePdf(await pdf.save(),'converted.pdf')}

const f=fs[0],pdf=await PDFDocument.load(await f.arrayBuffer());if(s==='split-pdf'){let range=(document.getElementById('range').value||'1-1').split('-').map(Number),start=Math.max(1,range[0]),end=Math.min(pdf.getPageCount(),range[1]||range[0]);if(end<start)throw Error('Invalid page range');let outPdf=await PDFDocument.create(),pages=await outPdf.copyPages(pdf,Array.from({length:end-start+1},(_,i)=>start-1+i));pages.forEach(p=>outPdf.addPage(p));return savePdf(await outPdf.save(),'split-pages.pdf')}
if(s==='pdf-page-numbers'){let font=await pdf.embedFont(StandardFonts.Helvetica),start=Number(document.getElementById('start').value)||1;pdf.getPages().forEach((p,i)=>{let {width}=p.getSize();p.drawText(String(start+i),{x:width-45,y:18,size:10,font,color:rgb(.25,.3,.4)})});return savePdf(await pdf.save(),'numbered.pdf')}

}catch(e){out(resultBox('COULD NOT PROCESS',esc(e.message||'Try a valid, unencrypted file.')))}}

function timerStart(s){if(timerState.running)return;timerState.running=true;if(s==='stopwatch')timerState.start=Date.now()-timerState.elapsed;timerId=setInterval(()=>{if(s==='stopwatch'){timerState.elapsed=Date.now()-timerState.start;let x=timerState.elapsed/1000;document.getElementById('clock').textContent=String(Math.floor(x/60)).padStart(2,'0')+':'+String(Math.floor(x%60)).padStart(2,'0')+'.'+Math.floor((x%1)*10)}else{timerState.sec=Math.max(0,timerState.sec-1);document.getElementById('clock').textContent=String(Math.floor(timerState.sec/60)).padStart(2,'0')+':'+String(timerState.sec%60).padStart(2,'0');if(!timerState.sec)timerPause()}},1000)}
