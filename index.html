function home(){let q=search.toLowerCase();let groupsHtml=groups.map(g=>{let ts=g.tools.map(x=>all.find(t=>t.slug===x[0])).filter(t=>(t.name+' '+t.desc+' '+t.group).toLowerCase().includes(q));if(q&&!ts.length)return '';return `<section class="cat"><div class="cathead"><span class="toolicon ${g.color}">${g.icon}</span><h3>${g.name}</h3><span class="rule"></span><small>${ts.length} tools</small></div><div class="grid">${ts.map(card).join('')}</div></section>`}).join('');app.innerHTML=`<main><section class="hero"><div><div class="eyebrow">✦ YOUR EVERYDAY TOOLKIT</div><h1>Little tools.<br><span>Big productivity.</span></h1><p class="lead">Everything you need to get things done — PDF, image, text and productivity tools, all in one beautiful place.</p><label class="search">⌕ <input id="search" value="${esc(search)}" placeholder="What do you want to do today?" aria-label="Search tools"><span>⌘ K</span></label><div class="trust"><span>♧ Browser-first tools</span><span>ϟ Fast & simple</span><span>♡ Free to use</span></div></div><div class="visual"><div class="mock"><div class="dots"><i></i><i></i><i></i></div><div class="doc"><span class="docico">▤</span><div><b>Project-summary.pdf</b><small>Ready to organize</small></div><span style="margin-left:auto;color:#18a777">✓</span></div><div class="progress"><span></span></div><div class="tiles"><span>▧</span><span>▦</span><span>T</span><span>∑</span></div></div><div class="float a">✓ Simple by design</div><div class="float b">✦ Your toolkit, upgraded</div></div></section><div class="stats"><div><b>${all.length}+</b><span>Handy tools</span></div><div><b>${groups.length}</b><span>Categories</span></div><div><b>0</b><span>Sign-ups needed</span></div><div><b>100%</b><span>Easy to use</span></div></div><section class="section" id="tools"><div class="sectionhead"><div><div class="eyebrow">FIND YOUR TOOL</div><h2>${q?'Search results':'Tools for every task'}</h2><p>Thoughtfully designed utilities to make everyday work easier.</p></div></div>${groupsHtml||'<div class="empty">No tools found. Try another search.</div>'}</section><section class="privacy" id="about"><div class="toolicon">♧</div><div><h3>Your files stay yours.</h3><p>Many tools process your files in your browser. Some previews use third-party services.</p></div><span class="badge">✓ Privacy-minded</span></section></main>`;document.getElementById('search').addEventListener('input',e=>{search=e.target.value;const pos=e.target.selectionStart;home();const i=document.getElementById('search');i.focus();i.setSelectionRange(pos,pos)});}
function input(label,id,type='text',value='',placeholder=''){return `<label class="label" for="${id}">${label}</label><input class="field" id="${id}" type="${type}" value="${esc(value)}" placeholder="${esc(placeholder)}">`}
function upload(accept='*/*',multiple=false){return `<label class="upload"><input id="file" type="file" accept="${accept}" ${multiple?'multiple':''}><b>⇧　Choose ${multiple?'files':'a file'}</b><small>Files stay on your device when processing is supported</small></label>`}
function btn(label,fn='runTool()'){return `<button class="btn" onclick="${fn}">${label}</button>`}
function textarea(id,placeholder='Enter or paste text here...'){return `<textarea class="area" id="${id}" placeholder="${placeholder}"></textarea>`}
function page(t){let body='';const s=t.slug;
if(['word-counter','character-counter','case-converter','remove-spaces','duplicate-lines','find-replace','text-diff','lorem-ipsum'].includes(s)){body=textarea('text');if(s==='find-replace')body+=input('Find','find')+input('Replace with','replace');if(s==='text-diff')body+=textarea('text2','Paste the second version to compare...');if(s==='lorem-ipsum')body=input('Number of paragraphs','count','number','3');body+=`<div id="metrics"></div><div class="buttonrow">${btn(s==='lorem-ipsum'?'Generate text':'Process text')}</div><div id="output"></div>`}
else if(s==='percentage-calculator')body=input('Percentage (%)','a','number','','e.g. 25')+input('Of number','b','number','','e.g. 200')+btn('Calculate')+'<div id="output"></div>';
else if(s==='discount-calculator')body=input('Original price','a','number')+input('Discount (%)','b','number')+btn('Calculate discount')+'<div id="output"></div>';
else if(s==='basic-calculator')body=input('First number','a','number')+`<label class="label">Operation</label><select id="op" class="field"><option>+</option><option>-</option><option>*</option><option>/</option></select>`+input('Second number','b','number')+btn('Calculate')+'<div id="output"></div>';
else if(s==='age-calculator')body=input('Date of birth','a','date','2000-01-01')+btn('Calculate age')+'<div id="output"></div>';
else if(s==='date-difference')body=input('Start date','a','date')+input('End date','b','date')+btn('Calculate difference')+'<div id="output"></div>';
else if(s==='unit-converter')body=input('Value','a','number')+`<label class="label">Conversion</label><select class="field" id="op"><option value="km-mi">Kilometers → Miles</option><option value="mi-km">Miles → Kilometers</option><option value="kg-lb">Kilograms → Pounds</option><option value="lb-kg">Pounds → Kilograms</option><option value="c-f">Celsius → Fahrenheit</option><option value="f-c">Fahrenheit → Celsius</option></select>`+btn('Convert')+'<div id="output"></div>';
else if(s==='password-generator')body=input('Password length (8–64)','a','number','16')+`<label><input id="symbols" type="checkbox" checked> Include symbols</label><div class="buttonrow">${btn('Generate password')}</div><div id="output"></div>`;
else if(s==='random-number')body=input('Minimum','a','number','1')+input('Maximum','b','number','100')+btn('Generate number')+'<div id="output"></div>';
else if(s==='uuid-generator')body=input('Number of UUIDs','a','number','1')+btn('Generate UUIDs')+'<div id="output"></div>';
else if(s==='qr-code-generator')body=input('Text or URL','a','text','https://example.com')+btn('Generate QR')+'<div id="output"></div><p class="notice">QR image preview uses a third-party QR service.</p>';
else if(s==='qr-code-reader')body+=upload('image/*')+btn('Open QR reader')+'<div id="output"></div><p class="notice">QR reading requires a QR decoder library; this starter opens the image for inspection.</p>';
else if(s==='notes-app')body=textarea('note','Your notes save automatically in this browser...')+`<div class="buttonrow"><button class="secondary" onclick="document.getElementById('note').value='';localStorage.removeItem('tn-note')">Clear notes</button><button class="secondary" onclick="copyText(document.getElementById('note').value)">Copy notes</button></div>`;
else if(s==='todo-list')body=input('New task','task','text','','What needs to get done?')+btn('Add task')+'<div id="output"></div>';

else if(['image-compressor','image-resizer','jpg-to-png','png-to-jpg','webp-to-jpg','jpg-to-webp','image-cropper','image-rotator','image-base64','favicon-generator'].includes(s))body=upload('image/*')+(s==='image-resizer'?input('Width (px)','w','number','800')+input('Height (px)','h','number','600'):'')+(s==='image-rotator'?input('Rotation degrees','deg','number','90'):'')+(s==='image-cropper'?input('Crop width (%)','w','number','80')+input('Crop height (%)','h','number','80'):'')+btn('Process image')+'<div id="output"></div>';
else if(['jpg-to-pdf','png-to-pdf','merge-pdf','split-pdf','compress-pdf','pdf-page-numbers'].includes(s))body=upload(s.includes('jpg-to-pdf')?'image/jpeg':s==='png-to-pdf'?'image/png':'application/pdf',s==='merge-pdf')+(s==='split-pdf'?input('Page range (e.g. 1-3)','range','text','1-1'):'')+(s==='pdf-page-numbers'?input('Starting page number','start','number','1'):'')+btn(s==='jpg-to-pdf'||s==='png-to-pdf'?'Convert to PDF':'Process PDF')+'<div id="output"></div><p class="notice">PDF processing uses the PDF library loaded from a public CDN. Advanced compression is limited by browser-side capabilities.</p>';
else if(['pdf-to-jpg','pdf-to-png'].includes(s))body+=upload('application/pdf')+btn('Convert pages to images')+'<div id="output"></div>';
else if(s==='video-thumbnail')body=input('YouTube URL or video ID','a','text','','Paste YouTube URL')+btn('Preview thumbnail')+'<div id="output"></div>';
else if(s==='audio-trimmer')body+=upload('audio/*')+'<div id="output"></div><p class="notice">Audio preview works here. Exportable trimming needs an encoder, which is not included in this static build.</p>';
else if(s==='video-gif')body+=upload('video/*')+'<div id="output"></div><p class="notice">Video preview is supported; GIF export needs an additional encoder.</p>';
app.innerHTML=`<main class="toolpage"><div class="crumb"><button onclick="go('')">Home</button>　›　${t.group}　›　${t.name}</div><div class="tooltitle"><div class="toolicon ${t.color}">${t.icon}</div><div><div class="eyebrow">${t.group.toUpperCase()}</div><h1>${t.name}</h1><p>${t.desc}</p></div></div><section class="workspace"><div class="workhead"><div><h2>Use ${t.name}</h2><p>Simple, fast and easy to use.</p></div><span style="font-size:10px;color:#218967">✓ Browser-first</span></div><div class="workbody">${body}</div></section><section class="steps"><div><b>01　Enter your input</b><p>Add your text, choose a file or enter the values needed.</p></div><div><b>02　Run the tool</b><p>Use the action button to process your input.</p></div><div><b>03　Save your result</b><p>Review your output and copy or download it.</p></div></section></main>`;
if(s==='notes-app'){let n=document.getElementById('note');n.value=localStorage.getItem('tn-note')||'';n.addEventListener('input',()=>localStorage.setItem('tn-note',n.value))}
if(s==='todo-list')renderTodos();
}
function out(s){let el=document.getElementById('output');if(el)el.innerHTML=s}
function resultBox(label,value){return `<div class="result"><small>${label}</small><b>${value}</b></div>`}
function download(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function copyText(t){navigator.clipboard?.writeText(t).then(()=>alert('Copied!')).catch(()=>alert('Select and copy the text manually.'))}
function runTool(){const s=route(),val=id=>document.getElementById(id)?.value||'',num=id=>Number(val(id));
if(['word-counter','character-counter','case-converter','remove-spaces','duplicate-lines','find-replace','text-diff','lorem-ipsum'].includes(s)){let t=val('text'),v=t;if(s==='word-counter'||s==='character-counter'){const words=t.trim()?t.trim().split(/\s+/).length:0;out(`<div class="metrics"><div class="metric"><small>Words</small><b>${words}</b></div><div class="metric"><small>Characters</small><b>${t.length}</b></div><div class="metric"><small>No spaces</small><b>${t.replace(/\s/g,'').length}</b></div><div class="metric"><small>Sentences</small><b>${t? t.split(/[.!?]+/).filter(x=>x.trim()).length:0}</b></div></div>`);return}if(s==='case-converter'){v=t.toUpperCase();out(`<div class="buttonrow"><button class="secondary" onclick="setText('${encodeURIComponent(t.toUpperCase())}')">UPPERCASE</button><button class="secondary" onclick="setText('${encodeURIComponent(t.toLowerCase())}')">lowercase</button><button class="secondary" onclick="setText('${encodeURIComponent(t.toLowerCase().replace(/\\b\\w/g,c=>c.toUpperCase()))}')">Title Case</button></div>`);return}if(s==='remove-spaces')v=t.split('\n').map(x=>x.trim().replace(/\s+/g,' ')).filter(Boolean).join('\n');if(s==='duplicate-lines')v=[...new Set(t.split('\n'))].join('\n');if(s==='find-replace')v=t.split(val('find')).join(val('replace'));if(s==='text-diff'){const t2=val('text2');out(resultBox('COMPARISON',`${t===t2?'Texts are identical.':'Texts differ.'} · First: ${t.length} chars · Second: ${t2.length} chars`));return}if(s==='lorem-ipsum')v=Array.from({length:Math.max(1,Math.min(30,num('count')||3))},()=>'Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.').join('\n\n');document.getElementById('text').value=v;out(`<div class="buttonrow"><button class="secondary" onclick="copyText(document.getElementById('text').value)">Copy result</button><button class="secondary" onclick="download(new Blob([document.getElementById('text').value],{type:'text/plain'}),'toolnova-text.txt')">Download TXT</button></div>`);return}
if(s==='percentage-calculator')return out(resultBox('RESULT',Number.isFinite(num('a')*num('b')/100)?String(num('a')*num('b')/100):'Enter valid numbers'));
if(s==='discount-calculator'){let price=num('a'),d=num('b');return out(resultBox('SALE PRICE',`${(price-price*d/100).toFixed(2)} · You save ${(price*d/100).toFixed(2)}`))}
if(s==='basic-calculator'){let a=num('a'),b=num('b'),op=val('op'),r=op==='+'?a+b:op==='-'?a-b:op==='*'?a*b:b===0?'Cannot divide by zero':a/b;return out(resultBox('RESULT',String(r)))}
if(s==='age-calculator'){let d=new Date(val('a')+'T00:00:00'),n=new Date();if(!val('a')||d>n)return out(resultBox('AGE','Enter a valid date'));let y=n.getFullYear()-d.getFullYear(),m=n.getMonth()-d.getMonth();if(n.getDate()<d.getDate())m--;if(m<0){y--;m+=12}return out(resultBox('YOUR AGE',`${y} years, ${m} months`))}
if(s==='date-difference'){let a=new Date(val('a')),b=new Date(val('b'));if(!val('a')||!val('b'))return out(resultBox('RESULT','Choose both dates'));return out(resultBox('DATE DIFFERENCE',`${Math.round(Math.abs(b-a)/86400000)} days`))}
if(s==='unit-converter'){let a=num('a'),op=val('op'),r=({'km-mi':a*.621371,'mi-km':a/0.621371,'kg-lb':a*2.20462,'lb-kg':a/2.20462,'c-f':a*9/5+32,'f-c':(a-32)*5/9})[op];return out(resultBox('CONVERTED VALUE',Number(r).toLocaleString(undefined,{maximumFractionDigits:5})))}
if(s==='password-generator'){let n=Math.max(8,Math.min(64,num('a')||16)),chars='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789'+(document.getElementById('symbols').checked?'!@#$%&*_-+=':'');let a=new Uint32Array(n);crypto.getRandomValues(a);let p=Array.from(a,x=>chars[x%chars.length]).join('');return out(`<div class="result"><small>YOUR PASSWORD</small><b style="font-size:17px">${esc(p)}</b><div class="buttonrow"><button class="secondary" onclick="copyText('${p}')">Copy password</button></div></div>`)}
if(s==='random-number'){let a=num('a'),b=num('b');if(b<a)return out(resultBox('ERROR','Maximum must be greater than minimum'));return out(resultBox('RANDOM NUMBER',String(Math.floor(Math.random()*(b-a+1))+a)))}
if(s==='uuid-generator'){let n=Math.max(1,Math.min(50,num('a')||1)),v=Array.from({length:n},()=>crypto.randomUUID()).join('\n');return out(`<textarea class="area">${v}</textarea><button class="secondary" onclick="copyText(${JSON.stringify(v)})">Copy UUIDs</button>`)}
if(s==='qr-code-generator'){let u='https://api.qrserver.com/v1/create-qr-code/?size=300x300&data='+encodeURIComponent(val('a'));return out(`<img class="qr" src="${u}" alt="QR code"><a class="btn" target="_blank" rel="noreferrer" href="${u}">Open QR image ↗</a>`)}
if(s==='video-thumbnail'){let v=val('a').trim(),m=v.match(/(?:v=|youtu\.be\/|shorts\/)([A-Za-z0-9_-]{6,})/),id=m?m[1]:v;return out(`<img class="preview" src="https://img.youtube.com/vi/${encodeURIComponent(id)}/maxresdefault.jpg" alt="Thumbnail"><a class="btn" target="_blank" rel="noreferrer" href="https://img.youtube.com/vi/${encodeURIComponent(id)}/maxresdefault.jpg">Open thumbnail ↗</a>`)}
if(s==='todo-list'){let v=val('task').trim();if(!v)return;let a=JSON.parse(localStorage.getItem('tn-todos')||'[]');a.push({text:v,done:false});localStorage.setItem('tn-todos',JSON.stringify(a));document.getElementById('task').value='';renderTodos();return}
if(s==='image-compressor'||s==='image-resizer'||s==='jpg-to-png'||s==='png-to-jpg'||s==='webp-to-jpg'||s==='jpg-to-webp'||s==='image-cropper'||s==='image-rotator'||s==='image-base64'||s==='favicon-generator')return imageTool(s);
if(s==='jpg-to-pdf'||s==='png-to-pdf'||s==='merge-pdf'||s==='split-pdf'||s==='compress-pdf'||s==='pdf-page-numbers'||s==='pdf-to-jpg'||s==='pdf-to-png')return pdfTool(s);
if(s==='qr-code-reader'){let f=document.getElementById('file').files[0];if(f){let u=URL.createObjectURL(f);out(`<img class="preview" src="${u}" alt="Selected QR image">`)}return}
if(s==='audio-trimmer'||s==='video-gif'){let f=document.getElementById('file').files[0];if(!f)return out(resultBox('FILE','Choose a file first'));let u=URL.createObjectURL(f);out(s==='audio-trimmer'?`<audio controls src="${u}"></audio>`:`<video controls class="preview" src="${u}"></video><p class="notice">Preview only; GIF export encoder is not included.</p>`);return}
}
function setText(v){document.getElementById('text').value=decodeURIComponent(v)}
async function imageTool(s){const f=document.getElementById('file').files[0];if(!f)return out(resultBox('NOTICE','Choose an image first'));if(s==='image-base64'){const r=new FileReader();r.onload=()=>out(`<textarea class="area">${esc(r.result)}</textarea><button class="secondary" onclick="copyText(document.querySelector('#output textarea').value)">Copy Base64</button>`);r.readAsDataURL(f);return}const img=new Image();img.onload=()=>{let w=img.width,h=img.height;if(s==='image-resizer'){w=Math.max(1,Number(document.getElementById('w').value)||w);h=Math.max(1,Number(document.getElementById('h').value)||h)}let c=document.createElement('canvas');if(s==='image-cropper'){w=Math.max(1,Math.floor(img.width*Math.min(100,Math.max(1,Number(document.getElementById('w').value)||80))/100));h=Math.max(1,Math.floor(img.height*Math.min(100,Math.max(1,Number(document.getElementById('h').value)||80))/100));c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h,0,0,w,h)}else{if(s==='image-rotator'&&Number(document.getElementById('deg').value)%180!==0)[w,h]=[h,w];c.width=w;c.height=h;let ctx=c.getContext('2d');if(s==='image-rotator'){ctx.translate(w/2,h/2);ctx.rotate((Number(document.getElementById('deg').value)||90)*Math.PI/180);ctx.drawImage(img,-img.width/2,-img.height/2)}else ctx.drawImage(img,0,0,w,h)}let mime=({'jpg-to-png':'image/png','png-to-jpg':'image/jpeg','webp-to-jpg':'image/jpeg','jpg-to-webp':'image/webp','favicon-generator':'image/png'})[s]||'image/jpeg';c.toBlob(b=>{if(!b)return out(resultBox('ERROR','Could not process this image'));let u=URL.createObjectURL(b);out(`<p class="notice">Original: ${img.width}×${img.height} · Result: ${w}×${h} · ${(b.size/1024).toFixed(1)} KB</p><img class="preview" src="${u}"><a class="btn" href="${u}" download="${s==='favicon-generator'?'favicon.png':'toolnova-image.'+({'image/png':'png','image/webp':'webp','image/jpeg':'jpg'}[mime])}">Download image ↓</a>`)},mime,s==='image-compressor'?.68:.92)};img.onerror=()=>out(resultBox('ERROR','Image could not be opened'));img.src=URL.createObjectURL(f)}
async function pdfTool(s){const fs=[...document.getElementById('file').files];if(!fs.length)return out(resultBox('NOTICE','Choose file(s) first'));if(!window.PDFLib)return out(resultBox('ERROR','PDF library failed to load. Check internet connection and retry.'));try{const {PDFDocument,StandardFonts,rgb}=PDFLib;if(s==='jpg-to-pdf'||s==='png-to-pdf'){const f=fs[0],bytes=await f.arrayBuffer(),pdf=await PDFDocument.create(),im=s==='png-to-pdf'?await pdf.embedPng(bytes):await pdf.embedJpg(bytes),pg=pdf.addPage([595,842]),sc=Math.min(540/im.width,780/im.height);pg.drawImage(im,{x:(595-im.width*sc)/2,y:(842-im.height*sc)/2,width:im.width*sc,height:im.height*sc});return savePdf(await pdf.save(),'converted.pdf')}
if(s==='merge-pdf'){let outPdf=await PDFDocument.create();for(const f of fs){const d=await PDFDocument.load(await f.arrayBuffer()),pages=await outPdf.copyPages(d,d.getPageIndices());pages.forEach(p=>outPdf.addPage(p))}return savePdf(await outPdf.save(),'merged.pdf')}
const f=fs[0],pdf=await PDFDocument.load(await f.arrayBuffer());if(s==='split-pdf'){let range=(document.getElementById('range').value||'1-1').split('-').map(Number),start=Math.max(1,range[0]),end=Math.min(pdf.getPageCount(),range[1]||range[0]);if(end<start)throw Error('Invalid page range');let outPdf=await PDFDocument.create(),pages=await outPdf.copyPages(pdf,Array.from({length:end-start+1},(_,i)=>start-1+i));pages.forEach(p=>outPdf.addPage(p));return savePdf(await outPdf.save(),'split-pages.pdf')}
if(s==='pdf-page-numbers'){let font=await pdf.embedFont(StandardFonts.Helvetica),start=Number(document.getElementById('start').value)||1;pdf.getPages().forEach((p,i)=>{let {width}=p.getSize();p.drawText(String(start+i),{x:width-45,y:18,size:10,font,color:rgb(.25,.3,.4)})});return savePdf(await pdf.save(),'numbered.pdf')}
if(s==='compress-pdf')return savePdf(await pdf.save({useObjectStreams:true}),'optimized.pdf');
if(s==='pdf-to-jpg'||s==='pdf-to-png'){if(!window.pdfjsLib)throw Error('PDF renderer did not load.');pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';let doc=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;let wrap='<p class="notice">Download each rendered page image:</p>';for(let i=1;i<=Math.min(doc.numPages,20);i++){let p=await doc.getPage(i),v=p.getViewport({scale:1.5}),c=document.createElement('canvas');c.width=v.width;c.height=v.height;await p.render({canvasContext:c.getContext('2d'),viewport:v}).promise;let u=c.toDataURL(s==='pdf-to-png'?'image/png':'image/jpeg',.9);wrap+=`<div style="margin:15px 0"><img class="preview" src="${u}"><a class="btn" href="${u}" download="page-${i}.${s==='pdf-to-png'?'png':'jpg'}">Download page ${i}</a></div>`}return out(wrap)}
}catch(e){out(resultBox('COULD NOT PROCESS',esc(e.message||'Try a valid, unencrypted file.')))}}
function savePdf(bytes,name){download(new Blob([bytes],{type:'application/pdf'}),name);out(resultBox('SUCCESS',`${name} downloaded.`))}
function renderTodos(){let el=document.getElementById('output');if(!el)return;let a=JSON.parse(localStorage.getItem('tn-todos')||'[]');el.innerHTML=a.map((t,i)=>`<div class="result" style="display:flex;gap:10px;align-items:center"><input type="checkbox" ${t.done?'checked':''} onchange="todoToggle(${i},this.checked)"><span style="flex:1;${t.done?'text-decoration:line-through;color:#9aa3b4':''}">${esc(t.text)}</span><button class="secondary" onclick="todoDelete(${i})">Delete</button></div>`).join('')}
function todoToggle(i,v){let a=JSON.parse(localStorage.getItem('tn-todos')||'[]');a[i].done=v;localStorage.setItem('tn-todos',JSON.stringify(a));renderTodos()}function todoDelete(i){let a=JSON.parse(localStorage.getItem('tn-todos')||'[]');a.splice(i,1);localStorage.setItem('tn-todos',JSON.stringify(a));renderTodos()}
function timerStart(s){if(timerState.running)return;timerState.running=true;if(s==='stopwatch')timerState.start=Date.now()-timerState.elapsed;timerId=setInterval(()=>{if(s==='stopwatch'){timerState.elapsed=Date.now()-timerState.start;let x=timerState.elapsed/1000;document.getElementById('clock').textContent=String(Math.floor(x/60)).padStart(2,'0')+':'+String(Math.floor(x%60)).padStart(2,'0')+'.'+Math.floor((x%1)*10)}else{timerState.sec=Math.max(0,timerState.sec-1);document.getElementById('clock').textContent=String(Math.floor(timerState.sec/60)).padStart(2,'0')+':'+String(timerState.sec%60).padStart(2,'0');if(!timerState.sec)timerPause()}},1000)}
function timerPause(){clearInterval(timerId);timerState.running=false}function timerReset(s){timerPause();timerState.elapsed=0;timerState.sec=s==='pomodoro-timer'?1500:s==='countdown-timer'?Math.max(1,Number(document.getElementById('mins').value)||5)*60:0;document.getElementById('clock').textContent=s==='stopwatch'?'00:00.0':String(Math.floor(timerState.sec/60)).padStart(2,'0')+':'+String(timerState.sec%60).padStart(2,'0')}
function render(){let r=route();if(!r){home();return}let t=all.find(x=>x.slug===r);if(!t){home();return}page(t)}
document.getElementById('year').textContent=new Date().getFullYear();document.getElementById('focusSearch').onclick=()=>{if(route())go('');setTimeout(()=>document.getElementById('search')?.focus(),30)};window.addEventListener('hashchange',()=>{timerPause();render();window.scrollTo(0,0)});window.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();if(route())go('');setTimeout(()=>document.getElementById('search')?.focus(),30)}});render();
</script></body></html>
